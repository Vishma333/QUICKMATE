<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - QuickMate</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      :root {
        --accent-color: #ff7618;
        --interaction-color: #1497d7;
        --interaction-dark: #107ab5;
        --interaction-glow: rgba(20, 151, 215, 0.4);

        --page-bg: #e8f4fa;
        --phone-body: #f7f9fa;
        --text-primary: #1a2b34;
        --text-secondary: #5a6a72;
        --text-subtle: #8a9aA2;
        
        --white-color: #ffffff;
        --border-color: #dce4e8;
        
        --border-radius-phone: 40px;
        --spacing-unit: 8px;
        --transition-fast: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%; width: 100%;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--page-bg);
        display: flex; align-items: center; justify-content: center;
        -webkit-font-smoothing: antialiased;
        padding: 20px;
      }

      .smartphone {
        width: 360px; height: 100%; max-height: 700px; background-color: var(--white-color);
        border-radius: var(--border-radius-phone);
        box-shadow: 0 25px 60px -12px rgba(0,0,0,0.25), 0 0px 15px rgba(0,0,0,0.1);
        display: flex; overflow: hidden;
      }

      .screen-content {
        width: 100%; height: 100%; background-color: var(--phone-body);
        border-radius: var(--border-radius-phone);
        display: flex; flex-direction: column; overflow: hidden;
        opacity: 0; animation: fadeIn 0.4s ease-in forwards;
      }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px;
        border-bottom: 1px solid var(--border-color);
      }
      
      header h1 {
        color: var(--text-primary);
        font-size: 20px;
        font-weight: 800;
      }

      header h1 i {
        margin-right: 8px;
        color: var(--interaction-color);
      }

      .btn-logout {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 22px;
        cursor: pointer;
        transition: color var(--transition-fast), transform var(--transition-fast);
      }

      .btn-logout:hover {
        color: var(--interaction-color);
        transform: scale(1.1);
      }
      
      .dashboard-main {
        flex-grow: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .welcome-message {
        margin-bottom: 24px;
      }
      .welcome-message h2 {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-primary);
      }
      .welcome-message p {
        font-size: 0.95rem;
        color: var(--text-secondary);
        max-width: 90%;
      }
      
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat-card {
        background-color: var(--white-color);
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--border-color);
        text-align: center;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      }

      .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(20, 151, 215, 0.15);
      }

      .stat-icon {
        font-size: 24px;
        color: var(--interaction-color);
        margin-bottom: 8px;
      }
      .stat-number {
        font-size: 26px;
        font-weight: 800;
        color: var(--text-primary);
      }
      .stat-label {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      
      .admin-actions {
        margin-top: 16px;
      }

      .admin-actions h3 {
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 16px;
      }

      .action-link {
        display: flex;
        align-items: center;
        background-color: var(--white-color);
        padding: 16px;
        border-radius: 12px;
        text-decoration: none;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
        transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      }
      .action-link:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(20, 151, 215, 0.1);
      }

      .action-link .action-icon {
        font-size: 18px;
        color: var(--white-color);
        background: linear-gradient(135deg, var(--interaction-color), var(--interaction-dark));
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        margin-right: 16px;
      }

      .action-text h4 {
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 600;
      }
      .action-text p {
        color: var(--text-secondary);
        font-size: 13px;
      }

      /* Entrance Animations */
      @keyframes fadeInUp { 
        from { opacity: 0; transform: translateY(20px); } 
        to { opacity: 1; transform: translateY(0); } 
      }
      
      .dashboard-main > * {
        animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; 
        opacity: 0;
      }

      .welcome-message { animation-delay: 0.1s; }
      .stats-grid { animation-delay: 0.2s; }
      .admin-actions { animation-delay: 0.3s; }
      
    </style>
</head>
<body>
    
  <div class="smartphone">
    <div class="screen-content">

        <header>
            <h1><i class="fas fa-user-shield"></i>Admin Panel</h1>
            <form method="POST" action="{{ url_for('logout') }}" id="logout-form">
                <button type="submit" class="btn-logout" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </form>
        </header>

        <main class="dashboard-main">

            <div class="welcome-message">
                <h2>Welcome, Admin!</h2>
                <!-- Displays the admin's email from the session -->
                <p>{{ session.user_email }}</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-number">1,428</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-file-medical"></i></div>
                    <div class="stat-number">312</div>
                    <div class="stat-label">Reports Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-bed"></i></div>
                    <div class="stat-number">Online</div>
                    <div class="stat-label">ICU Camera</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-server"></i></div>
                    <div class="stat-number">Healthy</div>
                    <div class="stat-label">System Status</div>
                </div>
            </div>

            <div class="admin-actions">
                <h3>Quick Actions</h3>
                <a href="#" class="action-link">
                    <div class="action-icon"><i class="fas fa-users-cog"></i></div>
                    <div class="action-text">
                        <h4>Manage Users</h4>
                        <p>View, edit, or remove users</p>
                    </div>
                </a>
                <a href="{{ url_for('icu_view') }}" class="action-link">
                    <div class="action-icon"><i class="fas fa-video"></i></div>
                    <div class="action-text">
                        <h4>Live ICU View</h4>
                        <p>Monitor the live camera feed</p>
                    </div>
                </a>
                 <a href="#" class="action-link">
                    <div class="action-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="action-text">
                        <h4>View Analytics</h4>
                        <p>Check usage and system reports</p>
                    </div>
                </a>
            </div>

        </main>
    </div>
  </div>

</body>
</html>
